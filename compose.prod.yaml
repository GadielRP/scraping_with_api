services:
  postgres:
    restart: unless-stopped
    # Capacity for dynamic shared memory, not a RAM reservation.
    shm_size: "128m"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-384m}"
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB",
              "-c", "maintenance_work_mem=32MB", "-c", "max_connections=20",
              "-c", "max_parallel_workers_per_gather=0"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  app:
    restart: unless-stopped
    # Hard containment boundary for the 1 GB production host. This is not a
    # reservation; Docker only kills/restarts the app if it reaches the ceiling.
    mem_limit: "${APP_MEMORY_LIMIT:-384m}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
    external: true
    name: sofascore_pgdata
