services:
  postgres:
    restart: unless-stopped
    # Parallel query workers need /dev/shm; Docker default (64MB) OOMs on
    # large UNION/joins used by maintenance backfills (DiskFull on shm resize).
    # 512m is enough on the 1GB host without matching local's full 1gb.
    shm_size: "512m"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  app:
    restart: unless-stopped
    # Hard containment boundary for the 1 GB production host. This is not a
    # reservation; Docker only kills/restarts the app if it reaches the ceiling.
    mem_limit: "${APP_MEMORY_LIMIT:-768m}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
    external: true
    name: sofascore_pgdata
